networks:
  labnet:
    driver: bridge
    enable_ipv6: true
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/24
          gateway: 172.28.0.1
        - subnet: fd00:c0de::/64
          gateway: fd00:c0de::1
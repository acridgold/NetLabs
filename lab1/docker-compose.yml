services:
  # --- IPv4 ---
  node1:
    build: .
    container_name: mcast-node1
    environment:
      GROUP_ADDRESS: 230.0.0.1
      PORT: "5000"
      IFACE: eth0
    networks:
      labnet:
        ipv4_address: 172.28.0.11
        ipv6_address: fd00:c0de::11
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
    tty: true

  node2:
    build: .
    container_name: mcast-node2
    environment:
